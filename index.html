<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aether IDE</title>
    <style>
      /* Pantalla de arranque (Parte 3, v0.4.0): evita el flash blanco del
         WebView mientras se carga el bundle. Estilos 100% inline, sin JS ni
         fuentes remotas; paleta Aether Night. React retira este placeholder
         automáticamente al hacer commit en #root. */
      html, body { margin: 0; background: #16161d; }
      #boot {
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        font-family: 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
        color: #e0e0e8;
        user-select: none;
      }
      #boot .logo { width: 56px; height: 56px; }
      #boot .name { font-size: 17px; font-weight: 600; letter-spacing: 0.4px; }
      #boot .bar {
        width: 168px;
        height: 3px;
        border-radius: 2px;
        background: #262731;
        overflow: hidden;
      }
      #boot .bar i {
        display: block;
        height: 100%;
        width: 40%;
        border-radius: 2px;
        background: #a78bfa;
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      #boot .hint { font-size: 11px; color: #7c7e92; }
      @keyframes boot-slide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(430%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .bar i { animation: none; width: 100%; opacity: 0.5; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot" aria-busy="true" aria-label="Cargando Aether IDE">
        <!-- Lote E: símbolo SVG inline con IDs únicos (boot-*) -->
        <svg class="logo" viewBox="0 0 256 256" width="56" height="56" fill="none" aria-hidden="true">
          <defs>
            <linearGradient id="boot-grad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#A78BFA"/>
              <stop offset="0.55" stop-color="#7C6CF5"/>
              <stop offset="1" stop-color="#3B82F6"/>
            </linearGradient>
          </defs>
          <circle cx="128" cy="128" r="96" fill="none" stroke="url(#boot-grad)" stroke-width="3" opacity="0.35"/>
          <path d="M128 48 Q128 128 208 128 Q128 128 128 208 Q128 128 48 128 Q128 128 128 48 Z" fill="url(#boot-grad)"/>
          <circle cx="196" cy="60" r="7" fill="#A78BFA"/>
        </svg>
        <div class="name">Aether IDE</div>
        <div class="bar"><i></i></div>
        <div class="hint">preparando el editor…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
